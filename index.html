<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agent de Vie</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #0D0D0F;
  color: white;
}

.container {
  max-width: 500px;
  margin: auto;
  padding: 20px;
}

.header {
  text-align: center;
  margin-top: 40px;
}

.header-sub {
  font-size: 12px;
  color: #777;
  letter-spacing: 2px;
}

h1 {
  margin: 10px 0;
}

.tagline {
  font-size: 14px;
  color: #aaa;
  margin-bottom: 30px;
}

.agents {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-bottom: 40px;
}

.agent {
  padding: 16px;
  border-radius: 12px;
  background: #1A1A1D;
  text-align: center;
}

.input-box {
  position: fixed;
  bottom: 0;
  width: 100%;
  background: #0D0D0F;
  padding: 20px;
}

.input-inner {
  display: flex;
  gap: 10px;
  max-width: 500px;
  margin: auto;
}

input {
  flex: 1;
  padding: 14px;
  border-radius: 12px;
  border: none;
  background: #1A1A1D;
  color: white;
}

button {
  padding: 14px;
  border-radius: 12px;
  border: none;
  background: #333;
  color: white;
}
</style>
</head>

<body>

<div class="container">

  <div class="header">
    <div class="header-sub">TES AGENTS DU QUOTIDIEN</div>
    <h1>Agent de Vie</h1>
    <div class="tagline">
      Agenda, rappels, courses et notes gérés automatiquement par des agents intelligents
    </div>
  </div>

  <div class="agents">
    <div class="agent">📅 Agenda</div>
    <div class="agent">🔔 Rappels</div>
    <div class="agent">🎯 Objectifs</div>
    <div class="agent">📝 Notes</div>
    <div class="agent">🛒 Courses</div>
  </div>

  <div style="text-align:center; margin-top:60px;">
    🤖<br><br>
    Écris ce que tu dois faire.<br>
    L’agent s’occupe du reste.
  </div>

</div>

<div class="input-box">
  <div class="input-inner">
    <input placeholder="Ex : dentiste mardi 14h, acheter du lait...">
    <button>➤</button>
  </div>
</div>

</body>
</html>
